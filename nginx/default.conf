server {
  listen 80;
  server_name algoboost.foo

  location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name algoboost.foo

  ssl_certificate     /etc/letsencrypt/live/algoboost.foo/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/algoboost.foo/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://receiver:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # history mode fallback
  location / {
    try_files $uri /index.html;
  }
}