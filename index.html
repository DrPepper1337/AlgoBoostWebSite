<link rel="icon" type="image/png" href="/favicon-black/favicon-96x96.png" id="dynamic-favicon">

<script>
  function setFaviconForTheme() {
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const favicon = document.getElementById('dynamic-favicon');

    if (isDark) {
      favicon.href = '/favicon-white/favicon-96x96.png';
    } else {
      favicon.href = '/favicon-black/favicon-96x96.png';
    }
  }

  setFaviconForTheme();

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setFaviconForTheme);
  }
</script>
