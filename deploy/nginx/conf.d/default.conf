server {
  listen 80;
  listen [::]:80;
  server_name algoboost.foo www.algoboost.foo;

  # ACME challenge (HTTP ONLY)
  location ^~ /.well-known/acme-challenge/ {
    alias /acme/.well-known/acme-challenge/;
    allow all;
    default_type "text/plain";
  }

  # everything else can redirect
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name algoboost.foo www.algoboost.foo;

  ssl_certificate     /etc/letsencrypt/live/algoboost.foo/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/algoboost.foo/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # acme challenge
  location ^~ /.well-known/acme-challenge/ {
    root /acme/.well-known/acme-challenge/;
    allow all;
    default_type "text/plain";
  }

  location /api/ {
    proxy_pass http://receiver:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
