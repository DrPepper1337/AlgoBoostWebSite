# HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name algoboost.foo www.algoboost.foo;

  # keep ACME path for renewals
  location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }

  return 301 https://$host$request_uri;
}

# HTTPS
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name algoboost.foo www.algoboost.foo;

  ssl_certificate     /etc/letsencrypt/live/algoboost.foo/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/algoboost.foo/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://receiver:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # optional: don’t 200 php scanners
  location ~ \.php$ { return 404; }
}
