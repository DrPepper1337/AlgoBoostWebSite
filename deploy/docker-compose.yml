
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    networks:
      - service-network
    env_file:
      - "../configs/Docker.env"


  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    networks:
      - service-network
    ports:
      - "9092:9092"
    env_file:
      -  "../configs/Docker.env"
    depends_on:
      - zookeeper
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list" ]
      interval: 5s
      timeout: 10s
      retries: 5

  solver:
    build:
      context: ../
      dockerfile: "build/solver/Dockerfile"
    container_name: solver
    env_file:
      - "../configs/Docker.env"
    networks:
      - service-network
    depends_on:
      zookeeper:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
      receiver:
        condition: service_started

  receiver:
    build:
      context: ../
      dockerfile: "build/receiver/Dockerfile"
    container_name: receiver
    env_file:
      - "../configs/Docker.env"
    networks:
      - service-network
    depends_on:
      zookeeper:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started

  postgres:
    image: postgres:latest
    container_name: postgres_container
    env_file:
      - "../configs/Docker.env"
    ports:
      - "5432:5432"
    networks:
      - service-network
    volumes:
      - ./postgres_data:/var/lib/postgresql/data



networks:
  service-network:
    driver: bridge