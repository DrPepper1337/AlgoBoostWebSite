services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    networks:
      - service-network
    env_file:
      - "../configs/Docker.env"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    networks:
      - service-network
    ports:
      - "9092:9092"
    env_file:
      - "../configs/Docker.env"
    depends_on:
      - zookeeper
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list" ]
      interval: 5s
      timeout: 10s
      retries: 5

  # solver:
  #   build:
  #     context: ../
  #     dockerfile: "build/solver/Dockerfile"
  #   container_name: solver
  #   env_file:
  #     - "../configs/Docker.env"
  #   networks:
  #     - service-network
  #   depends_on:
  #     zookeeper:
  #       condition: service_started
  #     kafka:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_started
  #     receiver:
  #       condition: service_started

  receiver:
    build:
      context: ../
      dockerfile: "build/receiver/Dockerfile"
    container_name: receiver
    env_file:
      - "../configs/Docker.env"
    ports:
      - "8080:8080"
    networks:
      - service-network
    depends_on:
      zookeeper:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started

  postgres:
    image: postgres:latest
    container_name: postgres_container
    env_file:
      - "../configs/Docker.env"
    ports:
      - "5432:5432"
    networks:
      - service-network
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ../
      dockerfile: "build/frontend/Dockerfile"
    container_name: frontend
    env_file:
      - "../configs/Docker.env"
    environment:
      - VITE_API_URL=http://receiver:8080
      - VITE_API_BASE_URL=http://localhost:8080
    ports:
      - "5173:5173"
    networks:
      - service-network
    depends_on:
      - receiver

  nginx:
    image: nginx:1.27-alpine
    container_name: web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - receiver
    networks: [ service-network ]

networks:
  service-network:
    driver: bridge
